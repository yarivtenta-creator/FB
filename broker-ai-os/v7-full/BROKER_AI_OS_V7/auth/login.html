<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Broker AI OS v5 — Sign In</title>
<style>
:root{--bg:#0a0e14;--panel:#111722;--line:#1f2937;--ink:#e6edf3;--muted:#8b98a9;--green:#2ecc71;--red:#ff5c5c;--accent:#4ea1ff;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);background-image:radial-gradient(circle at 30% -10%,#13243f 0%,transparent 55%);color:var(--ink);font-family:var(--mono);font-size:13px}
.card{width:340px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px}
h1{font-size:16px;margin:0 0 2px}h1 b{color:var(--accent)}.sub{color:var(--muted);font-size:11px;margin-bottom:20px}
label{display:block;color:var(--muted);font-size:11px;margin:12px 0 4px;text-transform:uppercase;letter-spacing:1px}
input[type=text],input[type=password]{width:100%;background:#0a0e14;border:1px solid var(--line);color:var(--ink);font-family:var(--mono);padding:9px 11px;border-radius:6px;font-size:13px}
input:focus{outline:none;border-color:var(--accent)}
.remember{display:flex;align-items:center;gap:8px;margin:14px 0;color:var(--muted);font-size:12px}
button{width:100%;margin-top:8px;background:var(--accent);color:#04101f;border:0;font-family:var(--mono);font-weight:bold;padding:11px;border-radius:7px;cursor:pointer;font-size:13px}
button:hover{filter:brightness(1.1)}
.msg{margin-top:14px;font-size:12px;min-height:16px}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.hint{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.6}
.lock{color:var(--muted);font-size:11px;text-align:center;margin-top:10px}
</style></head><body>
<form class="card" onsubmit="return doLogin(event)">
  <h1>Broker <b>AI OS</b> v5</h1>
  <div class="sub">Local sign-in · no external identity providers</div>
  <label for="u">Username</label>
  <input id="u" type="text" autocomplete="username" autofocus/>
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="current-password"/>
  <div class="remember"><input id="r" type="checkbox"/><label for="r" style="margin:0;text-transform:none;letter-spacing:0">Remember me (7 days)</label></div>
  <button type="submit">Sign In</button>
  <div id="msg" class="msg"></div>
  <div class="lock">🔒 Passwords are hashed (scrypt). Keys/secrets are never shown here.</div>
  <div class="hint">Mock users (change before any real use): admin / operator / viewer.<br/>Placeholder passwords are in HOW_TO_INSTALL.md.</div>
</form>
<script>
async function doLogin(e){
  e.preventDefault();
  const username=document.getElementById('u').value.trim();
  const password=document.getElementById('p').value;
  const remember=document.getElementById('r').checked;
  const msg=document.getElementById('msg');
  msg.className='msg';msg.textContent='Signing in…';
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password,remember})});
    const data=await res.json();
    if(data.ok){
      msg.className='msg ok';msg.textContent=`Welcome, ${data.username} (${data.role}). Redirecting…`;
      // store token for subsequent API calls (header-based); also set a cookie for navigation
      sessionStorage.setItem('auth_token',data.token);
      document.cookie=`auth=${data.token}; path=/; max-age=${Math.floor(data.expires_in_ms/1000)}`;
      setTimeout(()=>{window.location.href='/';},700);
    }else{
      msg.className='msg err';msg.textContent='Invalid username or password.';
    }
  }catch(err){ msg.className='msg err'; msg.textContent='Login unavailable (is the server running?).'; }
  return false;
}
</script></body></html>
