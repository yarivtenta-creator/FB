<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Integration Readiness Center</title><style>
:root{--bg:#0a0e14;--line:#1f2937;--ink:#e6edf3;--muted:#8b98a9;--green:#2ecc71;--red:#ff5c5c;--yellow:#f5c542;--accent:#4ea1ff;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;padding:24px}
h1{font-size:16px}h1 b{color:var(--accent)}.note{color:var(--muted);font-size:12px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #1a2230;font-size:12px;vertical-align:top}
th{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:1px}.muted{color:var(--muted)}
.r-low{color:var(--green)}.r-medium{color:var(--yellow)}.r-high{color:var(--red)}
.pill{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:1px 6px}
ul{margin:0;padding-left:16px}li{font-size:11px;color:var(--muted)}
</style></head><body>
<h1>Integration <b>Readiness Center</b></h1>
<div class="note">PRIORITY 8 · registry only · no connections · status · missing requirements · docs · risk level</div>
<table id="t"><thead><tr><th>Integration</th><th>Status</th><th>Missing Requirements</th><th>Docs</th><th>Risk</th></tr></thead><tbody></tbody></table>
<script>
const I=[
 {name:"T4",status:"mock_ready",missing_requirements:["real data API/SDK confirmation"],documentation_available:true,risk_level:"medium"},
 {name:"Plus500",status:"not_ready",missing_requirements:["official API access","data feed contract"],documentation_available:false,risk_level:"high"},
 {name:"Interactive Brokers",status:"not_ready",missing_requirements:["TWS/Gateway setup","read-only scope decision"],documentation_available:true,risk_level:"high"},
 {name:"TradingView",status:"not_ready",missing_requirements:["webhook/alert design (read-only)"],documentation_available:true,risk_level:"medium"},
 {name:"Polygon",status:"doc_review",missing_requirements:["plan/tier selection","rate-limit plan"],documentation_available:true,risk_level:"low"},
 {name:"Finnhub",status:"doc_review",missing_requirements:["plan/tier selection"],documentation_available:true,risk_level:"low"},
 {name:"News APIs",status:"doc_review",missing_requirements:["provider selection","licensing review"],documentation_available:true,risk_level:"low"}];
document.querySelector('#t tbody').innerHTML=I.map(i=>
 `<tr><td>${i.name}</td><td class="muted">${i.status}</td>
  <td><ul>${i.missing_requirements.map(m=>`<li>${m}</li>`).join('')}</ul></td>
  <td class="muted">${i.documentation_available?'yes':'no'}</td>
  <td class="r-${i.risk_level}"><span class="pill">${i.risk_level}</span></td></tr>`).join('');
</script></body></html>
