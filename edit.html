<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit — Go-Bigger Solutions</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232ee6e0%22/><text x=%2250%22 y=%2271%22 font-size=%2246%22 text-anchor=%22middle%22 font-family=%22Georgia,serif%22 fill=%22%23070d12%22>✎</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    /* ---- Editor chrome (never ships to the live site) ---- */
    :root { --edt: #2ee6e0; --edt-ink: #070d12; }

    body { padding-top: 64px; }

    #editor-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      z-index: 3000;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      background: rgba(9, 14, 20, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(46, 230, 224, 0.3);
      font-family: "Space Grotesk", system-ui, sans-serif;
      color: #ecf3f5;
    }
    #editor-bar .brand {
      display: flex; align-items: center; gap: 9px;
      font-weight: 600; font-size: 15px; white-space: nowrap;
    }
    #editor-bar .dot {
      width: 26px; height: 26px; border-radius: 7px;
      background: var(--edt); color: var(--edt-ink);
      display: grid; place-items: center; font-size: 15px;
    }
    #editor-bar .spacer { flex: 1; }

    #editor-bar button {
      font-family: inherit;
      font-size: 13.5px; font-weight: 600;
      border-radius: 999px;
      padding: 9px 18px;
      border: 1px solid rgba(236, 243, 245, 0.22);
      background: transparent;
      color: #ecf3f5;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }
    #editor-bar button:hover { border-color: var(--edt); color: var(--edt); }
    #editor-bar button.primary {
      background: var(--edt); color: var(--edt-ink); border-color: var(--edt);
    }
    #editor-bar button.primary:hover { filter: brightness(1.08); color: var(--edt-ink); }
    #editor-bar button.ghost { border-color: transparent; color: #89a1ae; }
    #editor-bar button.ghost:hover { color: #ff6b5e; border-color: transparent; }

    #edt-status {
      font-size: 12.5px; color: #89a1ae; min-width: 130px; text-align: right;
      white-space: nowrap;
    }
    #edt-status.saved { color: var(--edt); }

    /* Editing affordances */
    body.editing [data-edit] {
      outline: 1px dashed rgba(46, 230, 224, 0.35);
      outline-offset: 4px;
      border-radius: 3px;
      cursor: text;
      transition: outline-color .15s, background .15s;
    }
    body.editing [data-edit]:hover {
      outline-color: var(--edt);
      background: rgba(46, 230, 224, 0.06);
    }
    body.editing [data-edit]:focus {
      outline: 2px solid var(--edt);
      background: rgba(46, 230, 224, 0.08);
    }

    /* In edit mode, show everything (don't wait for scroll reveals) */
    body.editing .reveal { opacity: 1 !important; transform: none !important; }
    body.editing .line { transform: none !important; animation: none !important; }

    /* Little onboarding hint */
    #edt-hint {
      position: fixed;
      left: 50%; bottom: 22px; transform: translateX(-50%);
      z-index: 2999;
      background: rgba(9, 14, 20, 0.94);
      border: 1px solid rgba(46, 230, 224, 0.35);
      color: #ecf3f5;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 13.5px;
      padding: 12px 20px;
      border-radius: 999px;
      box-shadow: 0 18px 50px -20px rgba(0,0,0,.7);
      display: flex; align-items: center; gap: 12px;
    }
    #edt-hint b { color: var(--edt); font-weight: 600; }
    #edt-hint button {
      background: none; border: none; color: #89a1ae; cursor: pointer;
      font-size: 18px; line-height: 1; padding: 0;
    }
    #edt-hint.hide { display: none; }

    /* Toast */
    #edt-toast {
      position: fixed; top: 78px; left: 50%; transform: translateX(-50%) translateY(-12px);
      z-index: 3001;
      background: var(--edt); color: var(--edt-ink);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-weight: 600; font-size: 14px;
      padding: 12px 22px; border-radius: 999px;
      box-shadow: 0 18px 50px -18px rgba(0,0,0,.7);
      opacity: 0; pointer-events: none;
      transition: opacity .3s, transform .3s;
    }
    #edt-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 720px) {
      #editor-bar .brand span.label { display: none; }
      #editor-bar button { padding: 8px 13px; font-size: 12.5px; }
      #edt-status { display: none; }
    }
  </style>
</head>
<body>

  <!-- ===================== EDITOR TOOLBAR ===================== -->
  <div id="editor-bar" role="toolbar" aria-label="Content editor">
    <span class="brand"><span class="dot">✎</span><span class="label">Content Editor</span></span>
    <button id="edt-toggle" class="primary" type="button">✏️ Editing on</button>
    <span class="spacer"></span>
    <span id="edt-status">No changes yet</span>
    <button id="edt-reset" class="ghost" type="button" title="Discard all your changes">Reset</button>
    <button id="edt-download" type="button" title="Download the updated site file">⬇️ Download site</button>
    <button id="edt-save" class="primary" type="button">✓ Update</button>
  </div>

  <!-- Site markup is loaded here from index.html so design + content never drift -->
  <div id="site-root" aria-busy="true"></div>

  <!-- Onboarding hint -->
  <div id="edt-hint">
    <span>👆 Click any <b>text</b> to change it. When you're happy, hit <b>✓ Update</b>.</span>
    <button id="edt-hint-close" aria-label="Dismiss">×</button>
  </div>

  <div id="edt-toast" role="status" aria-live="polite"></div>

  <script>
  (function () {
    "use strict";

    var STORAGE_KEY = "gbs-content-edits-v1";
    var root = document.getElementById("site-root");
    var statusEl = document.getElementById("edt-status");
    var toastEl = document.getElementById("edt-toast");

    // Which elements are editable. Leaf text blocks only — never containers.
    var SELECTOR = [
      ".eyebrow", ".hero-title .line", ".hero-sub",
      ".section-title", ".section-lede",
      ".card-no", ".service-card h3", ".card-tag", ".service-card li", ".card-price span",
      ".step-body h3", ".step-body p", ".level-chip",
      ".manifesto p", ".about-col h3", ".about-col p",
      ".result-kicker", ".result-card h3", ".result-card p", ".text-link",
      ".pull-quote blockquote", ".pull-quote figcaption",
      ".contact-points li",
      ".closing-kicker", ".closing-title",
      ".footer-brand p", ".services-note",
      ".modal-note", ".modal-panel h2", ".pricing-legend",
      ".pricing-table tbody th", ".pricing-table td",
      ".btn"
    ].join(",");

    var baseHTML = "";      // pristine index.html text, kept for clean export
    var originals = {};     // id -> original innerHTML
    var editableNodes = []; // live nodes in the editor

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
    }

    function loadSaved() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
      catch (e) { return {}; }
    }

    function countChanges() {
      var saved = loadSaved();
      return Object.keys(saved).length;
    }

    function refreshStatus(justSaved) {
      var n = countChanges();
      if (justSaved) {
        statusEl.textContent = "Saved ✓";
        statusEl.classList.add("saved");
      } else if (n) {
        statusEl.textContent = n + " saved edit" + (n > 1 ? "s" : "");
        statusEl.classList.add("saved");
      } else {
        statusEl.textContent = "No changes yet";
        statusEl.classList.remove("saved");
      }
    }

    // 1) Pull the real site markup so the editor always matches production
    fetch("index.html", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("http " + r.status);
        return r.text();
      })
      .then(function (html) {
        baseHTML = html;
        var doc = new DOMParser().parseFromString(html, "text/html");
        // Drop the production script tag — the editor supplies its own behavior
        root.innerHTML = doc.body.innerHTML;
        root.querySelectorAll("script").forEach(function (s) { s.remove(); });
        initEditor();
      })
      .catch(function (err) {
        root.innerHTML =
          '<div style="max-width:640px;margin:120px auto;padding:0 24px;font-family:Inter,system-ui;color:#ecf3f5">' +
          '<h1 style="font-family:Fraunces,serif;font-weight:400;font-size:34px;margin-bottom:14px">Open this on your live site</h1>' +
          '<p style="color:#89a1ae;line-height:1.6">The editor needs to read <code>index.html</code> from the same web address. ' +
          'Once your site is deployed, visit <b>your-site-url/edit.html</b> and it will work. ' +
          '(Opening the file directly from your computer blocks this for security reasons.)</p>' +
          '<p style="color:#5f7280;margin-top:18px;font-size:13px">Technical detail: ' + String(err) + '</p></div>';
        document.getElementById("edt-hint").classList.add("hide");
      });

    function initEditor() {
      root.setAttribute("aria-busy", "false");

      // Assign stable ids by document order and snapshot originals
      editableNodes = Array.prototype.slice.call(root.querySelectorAll(SELECTOR));
      editableNodes.forEach(function (node, i) {
        node.setAttribute("data-edit", String(i));
        originals[i] = node.innerHTML;
      });

      // Re-apply anything the user saved before
      var saved = loadSaved();
      Object.keys(saved).forEach(function (id) {
        if (editableNodes[id]) editableNodes[id].innerHTML = saved[id];
      });

      // Run the real site behavior (3D canvas, modal, reveals) so it looks alive
      var s = document.createElement("script");
      s.src = "assets/app.js";
      document.body.appendChild(s);

      enterEditMode();
      refreshStatus(false);
    }

    // ---------- Edit mode ----------
    var editing = false;
    var toggleBtn = document.getElementById("edt-toggle");

    function setEditable(on) {
      editableNodes.forEach(function (node) {
        if (on) node.setAttribute("contenteditable", "true");
        else node.removeAttribute("contenteditable");
      });
    }

    function enterEditMode() {
      editing = true;
      document.body.classList.add("editing");
      setEditable(true);
      toggleBtn.textContent = "👁 Preview";
      toggleBtn.classList.remove("primary");
    }
    function exitEditMode() {
      editing = false;
      document.body.classList.remove("editing");
      setEditable(false);
      toggleBtn.textContent = "✏️ Edit";
      toggleBtn.classList.add("primary");
    }
    toggleBtn.addEventListener("click", function () {
      editing ? exitEditMode() : enterEditMode();
    });

    // While editing: paste as plain text, and don't let links/buttons navigate
    root.addEventListener("paste", function (e) {
      if (!editing) return;
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData("text/plain");
      document.execCommand("insertText", false, text);
    });
    root.addEventListener("click", function (e) {
      if (!editing) return;
      var t = e.target.closest("a, button");
      if (t && t.hasAttribute("data-edit")) { e.preventDefault(); }
    }, true);
    root.addEventListener("keydown", function (e) {
      // Enter inside a single-line-ish field shouldn't create messy markup
      if (editing && e.key === "Enter" && !e.shiftKey) {
        var el = e.target;
        if (el.matches && el.matches(".btn,.card-price span,.pricing-table td,.pricing-table th,.result-kicker,.card-no,.eyebrow,.level-chip,.closing-kicker")) {
          e.preventDefault();
          el.blur();
        }
      }
    });

    // Mark unsaved as the user types
    root.addEventListener("input", function () {
      statusEl.textContent = "Unsaved changes…";
      statusEl.classList.remove("saved");
    });

    // ---------- Save (Update) ----------
    document.getElementById("edt-save").addEventListener("click", function () {
      var edits = {};
      editableNodes.forEach(function (node, i) {
        var html = node.innerHTML;
        if (html !== originals[i]) edits[i] = html;
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(edits));
      refreshStatus(true);
      toast("Saved. Your changes are stored ✓");
    });

    // ---------- Reset ----------
    document.getElementById("edt-reset").addEventListener("click", function () {
      if (!confirm("Discard all your edits and go back to the original text?")) return;
      localStorage.removeItem(STORAGE_KEY);
      editableNodes.forEach(function (node, i) { node.innerHTML = originals[i]; });
      refreshStatus(false);
      toast("Reset to the original content");
    });

    // ---------- Download updated site ----------
    // Build a clean index.html (no editor code) with the user's text baked in.
    function buildPublishedHTML() {
      var doc = new DOMParser().parseFromString(baseHTML, "text/html");
      var targets = Array.prototype.slice.call(doc.body.querySelectorAll(SELECTOR));
      editableNodes.forEach(function (node, i) {
        if (targets[i] && node.innerHTML !== originals[i]) {
          targets[i].innerHTML = node.innerHTML;
        }
      });
      return "<!doctype html>\n" + doc.documentElement.outerHTML + "\n";
    }
    // expose for automated verification
    window.__buildPublishedHTML = buildPublishedHTML;

    document.getElementById("edt-download").addEventListener("click", function () {
      var html = buildPublishedHTML();
      var blob = new Blob([html], { type: "text/html" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "index.html";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      toast("Downloaded index.html — replace the old one to go live");
    });

    // Hint dismiss
    document.getElementById("edt-hint-close").addEventListener("click", function () {
      document.getElementById("edt-hint").classList.add("hide");
    });
  })();
  </script>
</body>
</html>
